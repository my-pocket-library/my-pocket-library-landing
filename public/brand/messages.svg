<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <g fill="none" stroke="#0E2472" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- the first message, leaning back a little -->
    <g transform="rotate(-4 150 84)">
      <rect x="82" y="46" width="136" height="72" rx="16" fill="#FDFAF4"/>
      <path d="M104 72 h84M104 90 h52"/>
      <path d="M118 118 l-6 16 20 -16" fill="#FDFAF4"/>
    </g>

    <!-- the reply, overlapping from the right -->
    <g transform="rotate(3 186 156)">
      <path d="M204 178 l8 16 8 -16 z" fill="#EE4C2C" stroke="#EE4C2C"/>
      <rect x="128" y="122" width="112" height="60" rx="14" fill="#EE4C2C"/>
      <path d="M148 144 h64M148 160 h38" stroke="#FDFAF4" stroke-width="2.6"/>
    </g>

    <!-- the open book the two are talking about -->
    <g transform="rotate(-5 96 208)">
      <path d="M96 190 c-11 -7 -25 -9 -38 -8 v38 c13 -1 27 1 38 8 z" fill="#FDFAF4"/>
      <path d="M96 190 c11 -7 25 -9 38 -8 v38 c-13 1 -27 -1 -38 8 z" fill="#FDFAF4"/>
      <path d="M96 190 v38"/>
      <path d="M68 194 h16M108 194 h16" stroke-width="2.2"/>
      <path d="M88 182 v12 l5 -4 5 4 v-12" fill="#EE4C2C" stroke="none"/>
    </g>

    <!-- the cord that carries the words from book to bubble -->
    <path d="M138 224 c22 8 34 2 38 -12 4 -13 -10 -18 -16 -8 -5 9 8 16 22 12" stroke-width="2.4"/>

    <!-- sparkles -->
    <path d="M56 60 c2.2 11.5 5.3 14.5 16.7 16.7 -11.4 2.2 -14.5 5.2 -16.7 16.7 -2.2 -11.5 -5.3 -14.5 -16.7 -16.7 11.4 -2.2 14.5 -5.2 16.7 -16.7 z" fill="#EE4C2C" stroke="none"/>
    <path d="M236 92 l0 14M229 99 l14 0" stroke="#EE4C2C" stroke-width="2.6"/>
    <path d="M226 224 c1.5 8 3.7 10 11.6 11.6 -7.9 1.6 -10.1 3.7 -11.6 11.6 -1.5 -7.9 -3.7 -10 -11.6 -11.6 7.9 -1.6 10.1 -3.7 11.6 -11.6 z" fill="#EE4C2C" stroke="none"/>
  </g>
</svg>
